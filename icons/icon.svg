<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="70%">
      <stop offset="0" stop-color="#3a3029"/>
      <stop offset="1" stop-color="#1e1c1a"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b877"/>
      <stop offset="1" stop-color="#c38d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0" stop-color="#ffcf73" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf73" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset=".6" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>
  <rect id="plate" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- smoke -->
  <g fill="#a59c8f" opacity=".55">
    <circle cx="332" cy="126" r="11"/>
    <circle cx="350" cy="102" r="14"/>
    <circle cx="374" cy="84" r="9"/>
  </g>
  <!-- chimney -->
  <rect x="312" y="150" width="38" height="80" rx="4" fill="#9c6c3c"/>
  <rect x="306" y="144" width="50" height="16" rx="4" fill="#b37c45"/>
  <!-- ground -->
  <rect x="104" y="384" width="304" height="18" rx="9" fill="#93b38d" opacity=".85"/>
  <!-- walls -->
  <rect x="152" y="246" width="208" height="144" rx="6" fill="url(#amber)"/>
  <!-- roof -->
  <path d="M112 266 L256 138 L400 266" fill="none" stroke="#e9c48a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- warm light from the door -->
  <ellipse cx="256" cy="372" rx="120" ry="70" fill="url(#glow)"/>
  <!-- doorway -->
  <path d="M220 390 V328 a36 36 0 0 1 72 0 V390 Z" fill="#2a211b"/>
  <!-- flame -->
  <path d="M256 384 c-22 0 -30 -16 -26 -32 c4 -14 16 -20 18 -36 c12 10 16 22 14 32 c6 -4 9 -10 9 -16 c10 12 13 26 9 36 c-4 10 -12 16 -24 16 Z" fill="url(#flame)"/>
  <rect x="234" y="380" width="44" height="7" rx="3.5" fill="#6b4a2e"/>
  <!-- windows -->
  <rect x="176" y="290" width="30" height="30" rx="4" fill="#2a211b"/>
  <rect x="306" y="290" width="30" height="30" rx="4" fill="#2a211b"/>
  <rect x="180" y="294" width="22" height="22" rx="2" fill="#ffc24a" opacity=".8"/>
  <rect x="310" y="294" width="22" height="22" rx="2" fill="#ffc24a" opacity=".8"/>
</svg>
